name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python3 -m backend.server ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options:
        - Local mode
        - AWS deployment
        - Edge agent
        - Release pipeline
        - CI
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python and Node versions. Don't paste credentials, tokens or account IDs.
