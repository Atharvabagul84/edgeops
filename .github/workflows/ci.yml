name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Application, frontend and AWS adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Backend and edge-agent tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Frontend tests
        run: node --test frontend/tests/*.test.mjs
      - name: AWS adapter tests
        run: python -X utf8 -m unittest discover -s infra/tests -v
      - name: Python syntax check
        run: python -m compileall -q backend scripts

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive -diff
      - name: Init without backend or credentials
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Validate the bootstrap root (deploy roles and state bucket)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  checkov:
    name: Checkov static scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Checkov
        run: python -m pip install --quiet checkov==3.3.26
      # The deploy workflow repeats this on the real plan JSON, where values are known.
      - name: Scan Terraform source
        run: checkov -d infra --framework terraform --config-file .checkov.yaml

  container:
    name: Docker build and loopback health check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t edgeops:ci .
      - name: Run container and wait for health endpoint
        run: |
          docker run -d --name edgeops -p 127.0.0.1:8765:8765 edgeops:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs edgeops
          exit 1
      - name: Remove container
        if: always()
        run: docker rm -f edgeops || true
